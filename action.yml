name: "beautiful score"
description: "Score screenshots 1-100 for beauty (composition, alignment, white space, colour harmony, contrast) and comment the table on the pull request."
author: "Solomon Bolotin"
branding:
  icon: "eye"
  color: "purple"
inputs:
  images:
    description: "Glob(s) of images to score, space-separated (e.g. 'e2e/screens/*.png')."
    required: true
  mode:
    description: "ui | art | logo"
    default: "ui"
  min:
    description: "Fail the step if any image scores below this number. Empty = never fail."
    default: ""
  comment:
    description: "Post / update a comment with the table on the pull request."
    default: "true"
  sarif:
    description: "Also write a SARIF file to this path (upload it with github/codeql-action/upload-sarif to see findings in code scanning)."
    default: ""
  github-token:
    description: "Token used to comment."
    default: ${{ github.token }}
outputs:
  min-score:
    description: "The lowest score among the images."
    value: ${{ steps.score.outputs.min-score }}
  table:
    description: "The markdown table."
    value: ${{ steps.score.outputs.table }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - id: score
      shell: bash
      env:
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_MIN: ${{ inputs.min }}
      run: python "${{ github.action_path }}/.github/scripts/score.py"
    - name: Annotate the images (lint findings)
      shell: bash
      run: beautiful --format github --mode "${{ inputs.mode }}" ${{ inputs.min && format('--min {0}', inputs.min) || '' }} ${{ inputs.images }} || true
    - if: ${{ inputs.sarif != '' }}
      shell: bash
      run: beautiful --format sarif --mode "${{ inputs.mode }}" ${{ inputs.images }} > "${{ inputs.sarif }}" || true
    - if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: python "${{ github.action_path }}/.github/scripts/comment.py"
