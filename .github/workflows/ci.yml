name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Ordering invariants
        run: python tests.py
      - name: CLI smoke test and CI gate
        run: |
          beautiful --mode=ui demo/screens/pinkas_documents.png --min 80
          beautiful --mode=art --json demo/art/mandala_radial.png > /dev/null
          python -m beautiful --mode=logo demo/art/shield_logo.png demo/art/random_noise.png
        shell: bash
      - name: MCP server smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"beauty_score","arguments":{"image":"demo/screens/pinkas_documents.png"}}}' | beautiful-mcp > mcp.out
          python - <<'PY'
          import json
          lines = [json.loads(l) for l in open("mcp.out", encoding="utf-8") if l.strip()]
          assert any(t["name"] == "beauty_compare" for l in lines if l.get("id") == 2 for t in l["result"]["tools"])
          call = next(l for l in lines if l.get("id") == 3)
          assert json.loads(call["result"]["content"][0]["text"])["score"] >= 85, call
          print("mcp ok")
          PY
        shell: bash
      - name: Lint formats (directory input, github annotations, sarif, baseline)
        run: |
          beautiful demo/art --mode=logo | head -3
          beautiful --mode=web --json demo/screens/pinkas_documents.png | python -c "import json,sys; d=json.load(sys.stdin); assert d['mode']=='web' and 1<=d['score']<=100, d"
          beautiful --format github demo/screens/github_login_unstyled.png | grep -q '^::warning file=demo/screens/github_login_unstyled.png'
          beautiful --format sarif demo/screens/pinkas_dialog.png > out.sarif
          python -c "import json; s=json.load(open('out.sarif')); assert s['version']=='2.1.0' and s['runs'][0]['results'], 'sarif'"
          beautiful --save-baseline base.json demo/screens/pinkas_dialog.png > /dev/null
          beautiful --baseline base.json demo/screens/pinkas_dialog.png > /dev/null
          python -c "import json; b=json.load(open('base.json')); b['demo/screens/pinkas_dialog.png']=99; json.dump(b,open('base.json','w'))"
          if beautiful --baseline base.json demo/screens/pinkas_dialog.png > /dev/null 2>&1; then echo "regression not detected"; exit 1; fi
        shell: bash
      - name: Action scorer smoke test
        env:
          INPUT_IMAGES: "demo/screens/pinkas_*.png"
          INPUT_MODE: ui
          INPUT_MIN: "50"
        run: python .github/scripts/score.py
        shell: bash

  render:
    name: render + lint the demo page (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install ".[render]" && python -m playwright install --with-deps chromium
      - name: The demo page must stay beautiful at every viewport
        run: beautiful docs/index.html --min 60 --save-renders renders/
      - name: HTML string and MCP render tool
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"beauty_render","arguments":{"source":"<html><body style=\"margin:0;display:grid;place-items:center;height:100vh;background:#fff\"><div style=\"width:240px;height:120px;background:#002e5f;border-radius:12px\"></div></body></html>","viewports":["desktop","mobile"]}}}' | beautiful-mcp > mcp.out
          python -c "import json; r=json.loads(open('mcp.out').readline()); d=json.loads(r['result']['content'][0]['text']); assert d['desktop']['score']>=80 and d['mobile']['score']>=80, d; print('render ok', d['desktop']['score'], d['mobile']['score'])"
      - name: DOM rules find every planted defect and none on the clean page
        run: |
          beautiful demo/lint/bad.html --viewports mobile --json > bad.json
          python - <<'PY'
          import json
          r = list(json.load(open("bad.json")).values())[0]
          found = {f["rule"] for f in r["rules"]}
          need = {"text-contrast", "font-size", "line-height", "text-clipped", "touch-target", "image-distortion", "img-alt", "heading-order", "font-size-mobile"}
          assert need <= found, need - found
          assert r["penalties"].get("rules"), r["penalties"]
          print("bad.html:", sorted(found))
          PY
          beautiful demo/lint/good.html --viewports mobile --json > good.json
          python - <<'PY'
          import json
          r = list(json.load(open("good.json")).values())[0]
          errors = [f for f in r["rules"] if f["level"] == "error"]
          assert not errors, errors
          print("good.html: no errors")
          PY
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: demo-renders
          path: renders/
