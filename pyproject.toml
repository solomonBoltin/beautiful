[project]
name = "beautiful-score"
version = "0.7.0"
description = "A mathematical beauty score, 1-100, for any screenshot, logo or artwork - computed from pixels with explicit, inspectable formulas."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Solomon Bolotin", email = "bina-solutions@gmail.com" }]
requires-python = ">=3.9"
keywords = [
  "aesthetics", "beauty", "ui", "ux", "design", "screenshot", "symmetry",
  "composition", "color-harmony", "mcp", "ai-agents", "claude-code", "cursor", "vibe-coding",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21", "pillow>=9.0", "scipy>=1.7"]

[project.optional-dependencies]
render = ["playwright>=1.40"]      # exact: headless Chromium, then `playwright install chromium`
html = ["weasyprint<53"]           # static, no browser: pure-Python CSS layout with PNG output

[project.urls]
Homepage = "https://github.com/solomonBoltin/beautiful"
Repository = "https://github.com/solomonBoltin/beautiful"
Issues = "https://github.com/solomonBoltin/beautiful/issues"
Author = "https://www.bina-solutions.co.il/"

[project.scripts]
beautiful = "beautiful.__main__:main"
beautiful-mcp = "beautiful.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["beautiful"]

[tool.setuptools.package-data]
beautiful = ["web_model.json", "ui_model.json"]
